<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DropForge Admin</title><style>body{font-family:system-ui;margin:0;background:#f7f7f4;color:#111}.wrap{max-width:1100px;margin:auto;padding:32px 20px}h1{font-size:42px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:20px}.num{font-size:34px;font-weight:800}.note{color:#666}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><main class="wrap"><p>DROP<span style="font-weight:400">FORGE</span> / ADMIN</p><h1>Store dashboard</h1><div class="cards"><div class="card"><div class="note">Orders</div><div class="num" id="orders">0</div></div><div class="card"><div class="note">Products</div><div class="num" id="products">0</div></div><div class="card"><div class="note">Revenue</div><div class="num" id="revenue">$0</div></div></div><p class="note">This first admin surface reads the local commerce store. Authentication and server-side authorization will be added when a backend is selected.</p></main><script>try{const s=JSON.parse(localStorage.getItem('dropforge-store-v1')||'{}');document.querySelector('#orders').textContent=(s.orders||[]).length;document.querySelector('#products').textContent=(s.products||[]).length;document.querySelector('#revenue').textContent='$'+(s.orders||[]).reduce((a,o)=>a+(o.total||0),0).toFixed(2)}catch(e){}</script></body></html>
